<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player | Alone - Marshmello</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="player">

    <!-- hidden checkbox -->
    <input type="checkbox" id="play">

    <!-- album art -->
    <div class="album-art"></div>

    <!-- song info -->
    <div class="song-info">
      <h3>Alone</h3>
      <p>Marshmello</p>
    </div>

    <!-- progress bar -->
    <div class="progress">
      <span></span>
    </div>

    <!-- controls -->
    <div class="controls">
      <div class="btn">⏮</div>

      <label for="play" class="btn play-btn">
        <span class="play">▶</span>
        <span class="pause">⏸</span>
      </label>

      <div class="btn">⏭</div>
    </div>

  </div>

</body>
</html>
